<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Nuestros Momentos</title>
<meta name="description" content="Un diario privado para guardar los momentos, regalos y dibujos de tu pareja.">
<meta name="theme-color" content="#c9184a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17111a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosotros">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-heart" aria-hidden="true">💗</div>
    <p>Cargando nuestros recuerdos…</p>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar" id="topbar">
      <button class="icon-btn" id="backBtn" type="button" aria-label="Volver" hidden>‹</button>
      <div class="topbar-title">
        <h1 id="viewTitle">Inicio</h1>
        <p id="viewSubtitle" class="topbar-sub"></p>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Secciones">
      <a class="tab" href="#/inicio" data-tab="inicio">
        <span class="tab-ico" aria-hidden="true">🏠</span><span class="tab-label">Inicio</span>
      </a>
      <a class="tab" href="#/recuerdos" data-tab="recuerdos">
        <span class="tab-ico" aria-hidden="true">🎁</span><span class="tab-label">Recuerdos</span>
      </a>
      <button class="tab tab-add" id="fabAdd" type="button" aria-label="Añadir recuerdo">
        <span class="tab-add-circle" aria-hidden="true">+</span>
      </button>
      <a class="tab" href="#/fechas" data-tab="fechas">
        <span class="tab-ico" aria-hidden="true">📅</span><span class="tab-label">Fechas</span>
      </a>
      <a class="tab" href="#/planes" data-tab="planes">
        <span class="tab-ico" aria-hidden="true">✨</span><span class="tab-label">Planes</span>
      </a>
    </nav>
  </div>

  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <div class="lock-heart" aria-hidden="true">🔒</div>
      <h2>Nuestros Momentos</h2>
      <p class="muted">Introduce tu código</p>
      <input id="lockInput" class="lock-input" type="password" inputmode="numeric" autocomplete="off"
             maxlength="12" aria-label="Código de acceso">
      <p id="lockError" class="lock-error" role="alert"></p>
      <button id="lockBtn" class="btn btn-primary" type="button">Entrar</button>
    </div>
  </div>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
  <noscript>
    <p style="padding:24px;font-family:sans-serif">Esta app necesita JavaScript para funcionar.</p>
  </noscript>
</body>
</html>
